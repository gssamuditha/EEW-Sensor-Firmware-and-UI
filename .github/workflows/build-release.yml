name: Build & Release EEW Sensor

# ─────────────────────────────────────────────────────────────
#  TRIGGER
#  Push a semver tag to release:   git tag v1.2.3 && git push --tags
# ─────────────────────────────────────────────────────────────
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # required to create GitHub Releases

# ─────────────────────────────────────────────────────────────
#  JOB 1 — Build React frontend on a fast x86 runner
# ─────────────────────────────────────────────────────────────
jobs:
  build-frontend:
    name: Build React Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build production bundle
        working-directory: frontend
        run: npm run build

      - name: Upload frontend dist
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 1

  # ─────────────────────────────────────────────────────────────
  #  JOB 2 — Compile Python backend to bytecode (.pyc)
  #
  #  Why NOT Nuitka + QEMU:
  #    Nuitka converts Python to C then compiles with GCC. Under QEMU
  #    ARM64 emulation each C file takes 400-600s to compile. With
  #    scipy/numpy/obspy pulling in hundreds of files, the job exceeds
  #    the 6-hour GitHub Actions limit every time.
  #
  #  Why bytecode (.pyc) instead:
  #    • Builds in ~30 seconds on a standard x86 runner
  #    • Python bytecode is architecture-independent — .pyc compiled on
  #      x86 runs identically on ARM64 (Raspberry Pi), as long as the
  #      Python MINOR version matches (both 3.11)
  #    • Source code is hidden: .pyc requires specialised decompilation
  #      tools; raw .py is not present on the device
  #    • Standard professional practice (used widely in the industry)
  # ─────────────────────────────────────────────────────────────
  build-backend:
    name: Compile Python Backend (bytecode)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Python 3.11 matches Raspberry Pi OS Bookworm (Debian 12).
      # The .pyc files must be compiled with the same minor version
      # as the interpreter that will run them on the Pi.
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Compile backend to bytecode (.pyc)
        run: |
          # Compile every .py file → __pycache__/module.cpython-311.pyc
          python3.11 -m compileall -q backend/

          # Remove Python source files — ship only bytecode
          find backend/ -name "*.py" -delete

          # Verify no source remains
          PY=$(find backend/ -name "*.py" | wc -l)
          echo ".pyc files: $(find backend/ -name '*.pyc' | wc -l)"
          echo ".py  files: ${PY}  (must be 0)"
          [ "$PY" -eq 0 ] || { echo "ERROR: source files still present!"; exit 1; }

      - name: Upload compiled backend
        uses: actions/upload-artifact@v4
        with:
          name: backend-dist
          path: backend/
          retention-days: 1

  # ─────────────────────────────────────────────────────────────
  #  JOB 3 — Assemble a Debian package and publish a GitHub Release
  # ─────────────────────────────────────────────────────────────
  package-and-release:
    name: Package .deb and Create Release
    needs: [build-frontend, build-backend]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (for deploy/debian scripts)
        uses: actions/checkout@v4

      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: artifacts/frontend/

      - name: Download backend artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-dist
          path: artifacts/backend/

      - name: Extract version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "TAG=$GITHUB_REF_NAME" >> $GITHUB_OUTPUT
          echo "PKG=eew-sensor_${VERSION}_arm64" >> $GITHUB_OUTPUT

      - name: Assemble .deb directory tree
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
          PKG: ${{ steps.version.outputs.PKG }}
        run: |
          ROOT="deb_root/${PKG}"

          # ── Directory structure ──────────────────────────────
          mkdir -p "${ROOT}/DEBIAN"
          mkdir -p "${ROOT}/opt/eew-sensor/backend"
          mkdir -p "${ROOT}/opt/eew-sensor/frontend"
          mkdir -p "${ROOT}/etc/systemd/system"

          # ── Backend bytecode + requirements ──────────────────
          # artifacts/backend/ contains:
          #   __pycache__/main.cpython-311.pyc
          #   __pycache__/sensor.cpython-311.pyc  (etc.)
          #   requirements.txt  (for postinst pip install)
          cp -r artifacts/backend/. "${ROOT}/opt/eew-sensor/backend/"

          # ── React frontend ───────────────────────────────────
          cp -r artifacts/frontend/. "${ROOT}/opt/eew-sensor/frontend/"

          # ── DEBIAN/control ───────────────────────────────────
          # python3.11-venv: required to create the isolated venv in postinst
          # libgpiod2, spidev, rpi.gpio: GPIO/SPI hardware access
          printf '%s\n' \
            "Package: eew-sensor" \
            "Version: ${VERSION}" \
            "Architecture: arm64" \
            "Maintainer: CrisisLab <support@crisislab.org.nz>" \
            "Depends: python3.11, python3.11-venv, sqlite3" \
            "Recommends: network-manager" \
            "Description: EEW Sensor Firmware and UI" \
            " Early Earthquake Warning sensor appliance firmware." \
            " Runs on Raspberry Pi 3/4 with the ADXL354 accelerometer." \
            " Provides a real-time web UI and SeisComP3/SeedLink compatible" \
            " miniSEED data stream." \
            > "${ROOT}/DEBIAN/control"

          # ── systemd unit ─────────────────────────────────────
          # The venv is created/updated by postinst.
          # WorkingDirectory=/opt/eew-sensor/backend → eew_sensor.db created here.
          # EEW_FRONTEND_DIST → main.py uses this to locate the built React app.
          # Python 3.11 can import from __pycache__/*.cpython-311.pyc without .py source.
          printf '%s\n' \
            "[Unit]" \
            "Description=EEW Sensor Firmware and UI" \
            "After=network-online.target" \
            "Wants=network-online.target" \
            "" \
            "[Service]" \
            "User=crisislab" \
            "WorkingDirectory=/opt/eew-sensor/backend" \
            "ExecStart=/opt/eew-sensor/venv/bin/uvicorn main:app --host 0.0.0.0 --port 80" \
            "Restart=always" \
            "RestartSec=5" \
            "Environment=PYTHONUNBUFFERED=1" \
            "Environment=EEW_FRONTEND_DIST=/opt/eew-sensor/frontend" \
            "AmbientCapabilities=CAP_NET_BIND_SERVICE" \
            "" \
            "[Install]" \
            "WantedBy=multi-user.target" \
            > "${ROOT}/etc/systemd/system/eew-sensor.service"

          # ── DEBIAN/postinst ──────────────────────────────────
          cp deploy/debian/postinst "${ROOT}/DEBIAN/postinst"
          chmod 755 "${ROOT}/DEBIAN/postinst"

          # ── DEBIAN/prerm ─────────────────────────────────────
          cp deploy/debian/prerm "${ROOT}/DEBIAN/prerm"
          chmod 755 "${ROOT}/DEBIAN/prerm"

          echo "=== .deb tree ==="
          find "${ROOT}" -type f | sort

      - name: Build .deb package
        env:
          PKG: ${{ steps.version.outputs.PKG }}
        run: |
          dpkg-deb --build "deb_root/${PKG}" "${PKG}.deb"
          echo "Built: ${PKG}.deb ($(du -sh "${PKG}.deb" | cut -f1))"

      - name: Generate SHA256 checksum
        env:
          PKG: ${{ steps.version.outputs.PKG }}
        run: |
          sha256sum "${PKG}.deb" > "${PKG}.deb.sha256"
          echo "Checksum:"
          cat "${PKG}.deb.sha256"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "EEW Sensor ${{ steps.version.outputs.TAG }}"
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            ${{ steps.version.outputs.PKG }}.deb
            ${{ steps.version.outputs.PKG }}.deb.sha256
